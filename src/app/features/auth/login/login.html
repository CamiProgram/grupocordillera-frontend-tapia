<div class="login-wrapper">
  <div class="login-card">
    
    <div class="login-header">
      <div class="logo-placeholder">
        <span class="logo-icon">GC</span>
      </div>
      <h2>Grupo Cordillera</h2>
      <p>Ingrese a su cuenta corporativa</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-container" [class.is-invalid]="esCampoInvalido('email')" [class.is-valid]="esCampoValido('email')">
          <input 
            id="email" 
            type="email" 
            formControlName="email" 
            placeholder="usuario@cordillera.cl"
            autocomplete="email">
        </div>
        <span class="error-text" *ngIf="esCampoInvalido('email')">
          {{ errorEmail }}
        </span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-container password-container" [class.is-invalid]="esCampoInvalido('password')" [class.is-valid]="esCampoValido('password')">
          <input 
            id="password" 
            [type]="showPwd ? 'text' : 'password'" 
            formControlName="password" 
            placeholder="••••••••"
            autocomplete="current-password">
          <button 
            type="button" 
            class="toggle-pwd-btn" 
            (click)="togglePasswordVisibility()"
            tabindex="-1">
            {{ showPwd ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
        <span class="error-text" *ngIf="esCampoInvalido('password')">
          {{ errorPassword }}
        </span>
      </div>

      <div class="alert-box error" *ngIf="errorMessage">
        <span class="alert-icon">⚠️</span>
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading || loginForm.invalid">
        <span *ngIf="!loading">Iniciar Sesión</span>
        <div class="spinner" *ngIf="loading"></div>
        <span *ngIf="loading">Validando...</span>
      </button>

    </form>
  </div>
</div>
